services:
  db:
    image: mariadb:10.11
    platform: linux/amd64
    environment:
      MARIADB_ROOT_PASSWORD: stoneage
      MARIADB_DATABASE: sa
    volumes:
      - stoneage_db:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-stoneage.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  saac:
    build:
      context: .
    platform: linux/amd64
    command: ["/usr/local/bin/start-saac"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - stoneage_state:/state
      - ./config/setup.cf:/opt/stoneage/gmsv/setup.cf:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9300"]
      interval: 3s
      timeout: 2s
      retries: 40

  gmsv:
    build:
      context: .
    platform: linux/amd64
    command: ["/usr/local/bin/start-gmsv"]
    depends_on:
      saac:
        condition: service_healthy
    volumes:
      - stoneage_state:/state
    ports:
      - "127.0.0.1:19065:9065"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9065"]
      interval: 3s
      timeout: 2s
      retries: 60

volumes:
  stoneage_db:
  stoneage_state:
