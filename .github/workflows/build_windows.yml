name: Build StoneAge Windows Client

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build StoneAge Client (VER25_RELEASE Win32)
        run: |
          msbuild client/stoneage.sln /p:Configuration=VER25_RELEASE /p:Platform=Win32 /p:PlatformToolset=v143 /verbosity:normal

      - name: Verify Executable Output
        run: |
          $exe = Get-ChildItem -Recurse -Filter "stoneage.exe" | Select-Object -First 1
          if ($exe) {
            Write-Host "SUCCESS: stoneage.exe found at $($exe.FullName)"
            New-Item -ItemType Directory -Force -Path "output"
            Copy-Item $exe.FullName -Destination "output/stoneage.exe"
            Get-ChildItem $exe.DirectoryName -Filter "*.pdb" |
              Copy-Item -Destination "output/" -ErrorAction SilentlyContinue
            Get-ChildItem $exe.DirectoryName -Filter "*.map" |
              Copy-Item -Destination "output/" -ErrorAction SilentlyContinue
            Copy-Item "client/third_party/lua/lua51.dll" -Destination "output/lua51.dll" -ErrorAction SilentlyContinue
            Copy-Item "client/sdk/*.dll" -Destination "output/" -ErrorAction SilentlyContinue
          } else {
            Write-Error "ERROR: stoneage.exe was not found anywhere in workspace!"
            exit 1
          }

      - name: Upload Windows Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stoneage-client-windows
          path: output/*
          if-no-files-found: error
